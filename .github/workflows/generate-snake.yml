name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:         # allows manual run from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # Required to push to the 'output' branch

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3   # latest is v3.4.1 as of late 2025
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}   # auto = Coha05
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake files to output branch
        uses: crazy-max/ghaction-github-pages@v5   # updated to latest v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
